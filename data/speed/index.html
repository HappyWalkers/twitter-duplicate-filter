<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformers.js Latency Benchmark</title>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #182232;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d3b4e;
      --primary: #38bdf8;
      --code-bg: #090d14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #fff;
    }
    p.subtitle {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .status-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: #334155;
      color: #94a3b8;
    }
    .badge.ready {
      background: #064e3b;
      color: #34d399;
    }
    .badge.busy {
      background: #78350f;
      color: #fbbf24;
    }
    pre#log {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 0;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 400px;
      max-height: 70vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Transformers.js Latency Benchmark</h1>
    <p class="subtitle">Benchmarking in-browser sentence-embedding latency and throughput.</p>
    <div class="status-bar">
      <span>Status: <strong id="statusText">Loading module...</strong></span>
      <span id="readyBadge" class="badge">INITIALIZING</span>
    </div>
    <pre id="log">Waiting for transformers.js module to import...</pre>
  </div>

  <!--
  SCOPE NOTE (added during review of the generated harness):
  This harness measures LATENCY ONLY. It applies { pooling: 'mean' } to every model,
  but three of the benchmarked models need 'lasttoken' pooling and two need 'cls'
  (see data/benchmark.py's MODELS table, verified against each repo's own
  1_Pooling/config.json). That is harmless here -- latency is dominated by the
  transformer forward pass, not by the pooling step -- but it means the embeddings
  this page produces are NOT valid for quality comparison. Accuracy numbers come
  from data/benchmark.py, never from here.
-->
<script type="module">
    const logEl = document.getElementById('log');
    const statusTextEl = document.getElementById('statusText');
    const readyBadgeEl = document.getElementById('readyBadge');

    function log(msg) {
      const ts = new Date().toLocaleTimeString();
      const line = `[${ts}] ${msg}`;
      console.log(line);
      if (logEl) {
        logEl.textContent += (logEl.textContent ? '\n' : '') + line;
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    function setStatus(text, isReady, isBusy = false) {
      if (statusTextEl) statusTextEl.textContent = text;
      if (readyBadgeEl) {
        readyBadgeEl.textContent = isBusy ? 'RUNNING' : (isReady ? 'READY' : 'INITIALIZING');
        readyBadgeEl.className = 'badge ' + (isBusy ? 'busy' : (isReady ? 'ready' : ''));
      }
    }

    try {
      log('Importing @huggingface/transformers@4 from jsDelivr...');
      const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4/+esm');
      log('Transformers.js v4 module successfully imported.');

      // Expose runBench to window
      window.runBench = async function(modelId, dtype, device, texts) {
        setStatus(`Benchmarking ${modelId} (${dtype}, ${device})...`, true, true);
        try {
          if (!texts || !Array.isArray(texts) || texts.length < 20) {
            throw new Error(`texts must contain at least 20 items (got ${texts?.length ?? 0})`);
          }

          log('------------------------------------------------------------');
          log(`runBench: modelId=${modelId}, dtype=${dtype}, device=${device}`);
          log(`Input texts: ${texts.length} items (using 4 for warmup, 20 for measurement)`);

          let lastProgressLog = 0;
          const progress_callback = (progress) => {
            if (!progress) return;
            if (progress.status === 'progress') {
              const now = performance.now();
              if (now - lastProgressLog > 250 || progress.progress === 100) {
                lastProgressLog = now;
                const pct = Math.round(progress.progress ?? 0);
                const loaded = progress.loaded ? `${(progress.loaded / 1048576).toFixed(1)}MB` : '';
                const total = progress.total ? `${(progress.total / 1048576).toFixed(1)}MB` : '';
                const details = loaded && total ? ` (${loaded}/${total})` : '';
                log(`[download] ${progress.file || 'model'}: ${pct}%${details}`);
              }
            } else if (progress.status === 'initiate' || progress.status === 'done') {
              log(`[${progress.status}] ${progress.file || ''}`);
            }
          };

          // 1. Time the pipeline load
          log(`Loading feature-extraction pipeline for ${modelId} (dtype: ${dtype}, device: ${device})...`);
          const tLoadStart = performance.now();
          const extractor = await pipeline('feature-extraction', modelId, {
            dtype,
            device,
            progress_callback
          });
          const loadMs = performance.now() - tLoadStart;
          log(`Pipeline loaded in ${(loadMs / 1000).toFixed(2)}s (${loadMs.toFixed(1)}ms)`);

          // Inspect actual device
          let actualDevice = device;
          if (extractor?.model?.sessions) {
            const firstSession = Object.values(extractor.model.sessions)[0];
            if (firstSession?.config?.device) {
              actualDevice = firstSession.config.device;
            }
          } else if (extractor?.model?.session?.config?.device) {
            actualDevice = extractor.model.session.config.device;
          }
          if (extractor?.model?.device) {
            actualDevice = extractor.model.device;
          }
          log(`Configured device: ${device} | Actual device: ${actualDevice}`);

          // 2. Warmup: run pipeline once over the first 4 texts. Discard timing.
          const warmupTexts = texts.slice(0, 4);
          log(`Warming up model on ${warmupTexts.length} texts...`);
          await extractor(warmupTexts, { pooling: 'mean', normalize: true });
          log('Warmup complete.');

          // 3. Measure: run 3 trials over a batch of exactly 20 texts with { pooling: 'mean', normalize: true }
          const batchTexts = texts.slice(0, 20);
          const trials = [];
          let lastOutput = null;
          log('Running 3 measurement trials on batch of 20 texts...');
          for (let i = 0; i < 3; i++) {
            const tTrialStart = performance.now();
            lastOutput = await extractor(batchTexts, { pooling: 'mean', normalize: true });
            const tTrialEnd = performance.now();
            const trialMs = tTrialEnd - tTrialStart;
            trials.push(trialMs);
            log(`  Trial ${i + 1}/3: ${trialMs.toFixed(2)} ms (${(trialMs / 20).toFixed(2)} ms/post)`);
          }

          // Take MEDIAN wall time as batchMs
          const sortedTrials = [...trials].sort((a, b) => a - b);
          const batchMs = sortedTrials[1];
          const warmMsPerPost = batchMs / 20;
          log(`Median batch time: ${batchMs.toFixed(2)} ms (${warmMsPerPost.toFixed(2)} ms/post)`);

          // 4. dim = output embedding dimension
          let dim = null;
          if (lastOutput?.dims && Array.isArray(lastOutput.dims) && lastOutput.dims.length >= 2) {
            dim = lastOutput.dims[lastOutput.dims.length - 1];
          } else if (lastOutput?.dims && Array.isArray(lastOutput.dims) && lastOutput.dims.length === 1) {
            dim = lastOutput.dims[0];
          } else if (Array.isArray(lastOutput) && Array.isArray(lastOutput[0])) {
            dim = lastOutput[0].length;
          } else if (lastOutput?.shape && Array.isArray(lastOutput.shape)) {
            dim = lastOutput.shape[lastOutput.shape.length - 1];
          } else if (typeof lastOutput?.size === 'number') {
            dim = lastOutput.size / 20;
          }
          log(`Embedding dimension: ${dim}`);

          // Dispose session if supported to aid GC
          if (typeof extractor.dispose === 'function') {
            try { await extractor.dispose(); } catch {}
          }

          setStatus(`Finished ${modelId} (${dtype})`, true, false);
          return {
            modelId,
            dtype,
            device,
            actualDevice,
            loadMs,
            warmMsPerPost,
            batchMs,
            dim,
            ok: true,
            error: null
          };
        } catch (err) {
          const errorMsg = String(err?.message || err);
          log(`[ERROR] runBench failed: ${errorMsg}`);
          setStatus(`Error on ${modelId}: ${errorMsg}`, true, false);
          // 5. On any throw, resolve (do NOT reject) with ok:false and error:String(err)
          return {
            modelId,
            dtype,
            device,
            actualDevice: null,
            loadMs: null,
            warmMsPerPost: null,
            batchMs: null,
            dim: null,
            ok: false,
            error: errorMsg
          };
        }
      };

      // Expose BENCH_READY
      window.BENCH_READY = true;
      setStatus('Ready for benchmarks', true, false);
      log('Harness ready. window.BENCH_READY = true');
    } catch (importErr) {
      const errStr = String(importErr?.message || importErr);
      log(`Failed to import transformers.js: ${errStr}`);
      setStatus(`Failed to initialize: ${errStr}`, false, false);
      window.BENCH_READY = false;
      window.BENCH_INIT_ERROR = errStr;
    }
  </script>
</body>
</html>
