<!doctype html>
<meta charset="utf-8">
<title>Timeline Dedup</title>
<style>
  :root { color-scheme: light dark; --fg: #0f1419; --muted: #536471; --bg: #fff; --line: #eff3f4; --accent: #1d9bf0; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e7e9ea; --muted: #8b98a5; --bg: #15202b; --line: #38444d; } }
  body { width: 268px; margin: 0; padding: 14px 16px; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
         color: var(--fg); background: var(--bg); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .stat { font-variant-numeric: tabular-nums; font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  switch, label.sw { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
  label.sw input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #8b98a5; border-radius: 999px; transition: .15s; cursor: pointer; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 2px; top: 2px;
                    background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }
  select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; padding: 3px 6px; }
  .note { margin: 6px 0 0; font-size: 11px; line-height: 1.4; }
  button { width: 100%; margin-top: 10px; padding: 7px; font: inherit; cursor: pointer;
           color: var(--fg); background: transparent; border: 1px solid var(--line);
           border-radius: 8px; }
  button:hover { border-color: #f4212e; color: #f4212e; }
  button:disabled { opacity: .5; cursor: default; border-color: var(--line); color: var(--muted); }
  footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
</style>

<h1>Timeline Dedup</h1>
<p class="sub">Collapses posts about the same story.</p>

<div class="row">
  <span>Enabled</span>
  <label class="sw"><input type="checkbox" id="toggle" checked><span class="slider"></span></label>
</div>
<div class="row">
  <span>Sensitivity</span>
  <select id="tau">
    <option value="0.94">Cautious</option>
    <option value="0.92">Balanced</option>
    <option value="0.89">Eager</option>
  </select>
</div>
<p class="note muted" id="note"></p>

<div class="row">
  <span>Posts seen <span class="muted">this page</span></span>
  <span class="stat" id="posts">–</span>
</div>
<div class="row">
  <span>Folded away</span>
  <span class="stat" id="collapsed">–</span>
</div>

<div class="row">
  <span>Remembered posts <span class="muted">on this device</span></span>
  <span class="stat" id="remembered">–</span>
</div>
<button id="forget" type="button">Forget remembered posts</button>

<footer id="foot">Runs on your device. Nothing is uploaded.</footer>
<script src="popup.js"></script>
